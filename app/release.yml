name: Create and Publish Release

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Select the version bump type (major, minor, patch)"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: "patch"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # We need to fetch all history and tags for npm version to work correctly
          fetch-depth: 0
          # Use the PAT to allow pushing changes back to the repository
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configure Git user
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit, and tag
        id: version_bumper
        run: |
          # This command updates package.json, creates a commit, and adds a git tag.
          # The new version number is captured for the next step.
          npm version ${{ github.event.inputs.version_type }} -m "chore(release): bump version to %s"
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=v${NEW_VERSION}" >> $GITHUB_OUTPUT

      - name: Push changes and tags to the repository
        run: git push --follow-tags

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version_bumper.outputs.new_version }}
          release_name: "Release ${{ steps.version_bumper.outputs.new_version }}"
          body: "New release for version ${{ steps.version_bumper.outputs.new_version }}. See commit history for details."
          draft: false
          prerelease: false
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sticky Note Banner Versions</title>
</head>
<body>
  <main>
    <h1>Sticky Note Banner Samples</h1>

    <!-- Version 1: Classic yellow note -->
    <div style="position: sticky; top: 12px; z-index: 999; margin: 16px 0; padding: 14px 18px; background: #fef08a; color: #422006; border: 1px solid #facc15; border-radius: 8px; box-shadow: 0 8px 18px rgba(0,0,0,0.15); font-family: Arial, sans-serif; font-weight: 600; transform: rotate(-0.5deg);">
      📌 Sample note: Early-access rollout starts this Friday at 6:00 PM UTC.
    </div>

    <!-- Version 2: Soft blue pinned card -->
    <div style="position: sticky; top: 12px; z-index: 999; margin: 16px 0; padding: 14px 18px; background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #1e3a8a; border: 1px solid #93c5fd; border-left: 6px solid #2563eb; border-radius: 10px; box-shadow: 0 10px 20px rgba(37,99,235,0.2); font-family: Inter, Arial, sans-serif;">
      📝 Sample note: Documentation updates are live — check the latest setup guide before onboarding staff.
    </div>

    <!-- Version 3: Dark glass sticky alert -->
    <div style="position: sticky; top: 12px; z-index: 999; margin: 16px 0; padding: 14px 18px; background: rgba(15,23,42,0.88); color: #e2e8f0; border: 1px solid rgba(148,163,184,0.45); border-radius: 12px; box-shadow: 0 12px 26px rgba(2,6,23,0.35); font-family: Inter, Arial, sans-serif; backdrop-filter: blur(4px);">
      🔔 Sample note: Maintenance window tonight from 1:00–1:30 AM UTC. Activity logs may be delayed.
    </div>
  </main>
</body>
</html>
